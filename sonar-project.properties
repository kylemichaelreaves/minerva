# SonarQube Cloud analysis config. The project key follows the
# auto-provisioned `<org>_<repo>` convention the other twelve projects on
# this account use.
#
# Coverage is not produced here — the `python` and `web` jobs in
# check.yml already emit `coverage.xml` (cobertura) and
# `web/coverage/lcov.info`, and the `sonar` job downloads both before
# scanning. Keep the paths below in step with those two upload steps.

sonar.projectKey=kylemichaelreaves_minerva
sonar.organization=kylemichaelreaves
sonar.projectName=minerva

sonar.sources=src,web/src,scripts,perseus
sonar.tests=tests,web/tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# Build output, the corpus itself, and vendored/derived trees. `data/`
# holds the SQLite index and multi-gigabyte source texts — not code.
sonar.exclusions=\
  web/dist/**,\
  data/**,\
  node_modules/**,\
  **/__pycache__/**,\
  .design-bundle/**,\
  src/minerva/corpus_registry.py,\
  src/minerva/author_ordering.py,\
  web/src/data/atlasData.ts,\
  web/src/utils/dominantPhil.ts

# The four files above are codegen'd from data/authors/manifest.yaml by
# scripts/generate_author_artifacts.py and verified by `make
# check-authors`. An issue raised against them cannot be fixed in place —
# the next regeneration overwrites it — so they are analysed as data, not
# source.

# Operator tooling: one-off ingest scripts and Perseus downloaders. They
# are analysed for issues but not held to a coverage bar; they are run by
# hand against the corpus, not exercised by the suite.
sonar.coverage.exclusions=\
  scripts/**,\
  perseus/**,\
  web/src/**/*.stories.tsx,\
  web/tests/e2e/**
