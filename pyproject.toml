[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minerva"
version = "0.1.0"
description = "Retrieval-grounded reader and agent over a multilingual corpus of philosophy and primary sources (Greek, Latin, German, French, English, Hebrew, Arabic)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.4.6",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=5.7.0"]
hegel = ["pymupdf>=1.28.2", "ebooklib>=0.20", "beautifulsoup4>=4.15.0", "lxml>=6.1.1"]
# Lemmatizer + glossary-importer dependencies. Optional because the
# Reader / chat / translate paths don't need them; only curators do.
# Install both halves:
#
#     uv pip install -e '.[lemma]' && uv pip install -r lemma-models.txt
#
# The model wheels themselves are NOT here — they live in
# `lemma-models.txt`, which explains why at length (#282). The short
# version: `uv sync --locked` re-derives metadata for every `direct+https`
# dependency in the graph in order to verify the lock, whatever extra is
# being installed, so a model wheel declared here made every CI job fetch
# from github.com and huggingface.co, and a 429 from either failed the PR.
# Keeping this extra free of URL dependencies is what stops that.
#
# `tests/test_lemma_models_pinning.py` fails if a URL requirement comes
# back into any extra, or if `uv.lock` regains a model-host URL.
lemma = [
    # spaCy ≥3.8 is needed for any Python ≥3.13 (older versions pull
    # `blis<0.8`, which fails to compile against 3.13's longobject API).
    # The models it loads — de/fr/en/grc/la — install from
    # `lemma-models.txt`.
    "spacy>=3.8.15",
    # Stanza: fallback for grc/lat when the LatinCy wheels are missing;
    # primary for Hebrew (`heb`) and Arabic (`ara`). Models download to
    # ~/stanza_resources/ on first use (~250 MB grc, ~80 MB la).
    "stanza>=1.14.0",
    "pyyaml>=6.0.3",
]
all = [
    "sentence-transformers>=5.7.0",
    "pymupdf>=1.28.2",
    "ebooklib>=0.20",
    "beautifulsoup4>=4.15.0",
]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.2", "pyyaml>=6.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# `-W error::ResourceWarning` promotes an unclosed file/socket/DB handle
# to a test failure. It is a cheap, broad gate on a real class of bug:
# turning it on for #246 surfaced six production CLI handlers that opened
# a store and never closed it (`cmd_index` was 54 of the 900 warnings),
# the same defect #227 fixed in the `terms` CLI. It could not be adopted
# until those — and the test-side connections `tests/conftest.py` now
# owns — were fixed. Run with `-X tracemalloc=20` to get the allocation
# site when it fires.
addopts = "-q -W error::ResourceWarning"

# Coverage config — `pytest --cov` reads this when pytest-cov is
# installed (in [dev]). Plain `pytest` still works without coverage
# tooling. CI emits a terminal report + an XML file for any future
# upload to Codecov-style dashboards; no failure threshold yet (a
# baseline lives in the audit memory once one is set).
[tool.coverage.run]
source = ["src/minerva"]
# `src/minerva/migrations/*` was omitted here until 2026-08-12, on the
# stated grounds that "migrations are append-only; coverage churn there
# would mask real regressions in the live code paths." Measured, that
# reasoning inverted itself: the suite exercises the migration chain on
# every `store.open_db`, so the directory runs at 58-100% per file (0027
# and 0021 at 100%, 0030 at 96%) — but omitting it kept all of that out of
# `coverage.xml`, and SonarCloud, which does NOT list migrations in
# `sonar.coverage.exclusions`, therefore scored the files it could see as
# 0%:
#
#     kylemichaelreaves_minerva:src/minerva/migrations/0027_chunk_lemma_state.py
#     coverableLines 11, coveredLines 0, lineCoveragePercent 0
#
# So the omission did not suppress churn; it manufactured a false zero in
# the one coverage gate that blocks a merge, and every PR adding a
# migration paid for it against the 80%-on-new-code bar. The two configs
# now agree. If migrations should genuinely be exempt, the exemption
# belongs in BOTH files — see #339.
omit = [
    "src/minerva/cli/__init__.py",  # thin dispatch shim
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/minerva/migrations"]

[tool.ruff.lint]
# Strict baseline. Each family chosen for a specific class of bug:
#   E/W   — pycodestyle whitespace & syntax shape
#   F     — pyflakes (unused imports, undefined names, redefinitions)
#   I     — isort (import ordering, single source of truth for sort key)
#   UP    — pyupgrade (force modern syntax, e.g. `list[int]` not `List[int]`)
#   B     — bugbear (catches mutable-default args, shadowed builtins, etc.)
#   SIM   — refactor hints (collapse if/else, redundant `bool()`, etc.)
#   C4    — comprehension idioms (avoid `list([...])`)
#   RUF   — ruff's own opinionated checks
#   PTH   — prefer pathlib over os.path
#   PIE   — flake8-pie miscellany (unused try/except, dict literal merges)
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PTH", "PIE"]
ignore = [
    # Module-level "private" prefix `_foo` is a project convention here
    # (signals internal-only intent); ruff's N802/N803 rules around naming
    # would otherwise object to underscore-prefixed callables in CLI handlers.
    # N002, etc. aren't selected above so this is just a forward note.
    "E501",   # line length — let formatter handle, leave room for long URLs / SQL
    "SIM108", # ternary substitution — readability often favors if/else here
    "B008",   # default arg call (e.g. `field(default_factory=...)`) — false positives
    # "Ambiguous unicode" rules: meant to flag homoglyph attacks, but this
    # corpus is built around Greek (α, ε, ι…) and German diacritics —
    # those characters are first-class data, not lookalike-Latin smuggled in.
    "RUF001", # in strings
    "RUF002", # in docstrings
    "RUF003", # in comments
]

[tool.ruff.lint.per-file-ignores]
# Tests can re-use names, shadow fixtures, and skip docstrings without penalty.
"tests/**" = ["F841", "B017"]
# Migrations are append-only by convention; ruff churn on old migrations
# would force editing committed history.
"src/minerva/migrations/**" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
# Codegen-owned files. `scripts/generate_author_artifacts.py` writes into
# sentinel regions of these, and `--check` compares the on-disk region against
# what the generator emits. `ruff format` rewrites content *inside* those
# regions, so formatting them makes the manifest-sync gate fail — running the
# repo's own `make format-py` broke the repo's own `make check` (#136).
#
# Excluded from `format` only; `ruff check` (lint) still covers them.
#
# The tidier fix is to make the generator emit ruff-formatted blocks so no
# exception is needed. That's a change to the generator's write+check
# contract and belongs in its own diff — see #136.
#
# Note this excludes from *directory* invocations (`ruff format src tests`,
# which is what `make format-py` runs). Ruff still formats these when they
# are named explicitly on the command line unless `--force-exclude` is
# passed — worth knowing before wiring ruff into a per-file pre-commit hook.
exclude = [
    "src/minerva/corpus_registry.py",
    "src/minerva/author_ordering.py",
]

[project.scripts]
minerva = "minerva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minerva = ["eval_data/*.jsonl"]
