# TEMPORARY — benchmark for #757, removed before merge. Runs the python job's
# pytest command with the test temp dir on the runner's disk vs on tmpfs
# (/dev/shm), two repetitions each, concurrently, so runner drift hits both.

name: pytest-bench

on:
  pull_request:
    paths: [.github/workflows/pytest-bench.yml]

permissions:
  contents: read

jobs:
  bench:
    name: bench · ${{ matrix.tmp }} · ${{ matrix.rep }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tmp: [disk, shm]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - run: uv sync -p 3.13 --locked --extra dev --extra hegel

      - name: Runner facts
        run: |
          nproc; free -m; df -h /tmp /dev/shm
          findmnt -no FSTYPE,SOURCE /tmp /dev/shm || true

      - name: Choose TMPDIR
        run: |
          if [ "${{ matrix.tmp }}" = shm ]; then
            mkdir -p /dev/shm/pytest && echo "TMPDIR=/dev/shm/pytest" >> "$GITHUB_ENV"
          fi

      - name: Fresh open_db cost, per filesystem
        run: |
          uv run --no-sync python - <<'EOF'
          import pathlib, sqlite3, tempfile, time
          from minerva import store
          def bench(root, label, sync_off=False):
              orig = sqlite3.connect
              if sync_off:
                  def c(*a, **k):
                      x = orig(*a, **k); x.execute("PRAGMA synchronous=OFF"); return x
                  sqlite3.connect = c
              d = pathlib.Path(tempfile.mkdtemp(dir=root)); ts = []
              for i in range(20):
                  t = time.perf_counter(); store.open_db(d / f"t{i}.sqlite").close()
                  ts.append(time.perf_counter() - t)
              sqlite3.connect = orig
              ts.sort(); print(f"{label:28s} median {ts[10]*1000:7.1f}ms  max {ts[-1]*1000:7.1f}ms")
          bench("/tmp", "/tmp (disk), sync=FULL")
          bench("/tmp", "/tmp (disk), sync=OFF", sync_off=True)
          bench("/dev/shm", "/dev/shm (tmpfs), sync=FULL")
          EOF

      - name: pytest startup (collection only, no workers)
        run: |
          s=$(date +%s.%N)
          uv run --no-sync pytest tests/ --co -q -n 0 -p no:cacheprovider > /dev/null
          echo "collect-only: $(echo "$(date +%s.%N) - $s" | bc)s"

      - name: pytest (same command as check.yml)
        run: |
          s=$(date +%s.%N)
          uv run --no-sync pytest tests/ -q --cov --cov-report=term --cov-report=xml -n auto --durations=10
          echo "BENCH ${{ matrix.tmp }} ${{ matrix.rep }} pytest wall: $(echo "$(date +%s.%N) - $s" | bc)s"
