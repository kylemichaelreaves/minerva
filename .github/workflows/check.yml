# `check` mirrors `make check` (lint + typecheck + tests + coverage)
# so the gate every contributor runs locally is also the gate CI
# enforces. Three jobs:
#
#   * python — lint + pytest with coverage
#   * web — lint + typecheck + vitest with coverage
#   * web-e2e — runs only on `main` pushes (skipped on PRs). The e2e
#     suite spawns `minerva serve --llm none` and stitches Vitest
#     against it; stable but ~30s of warm-up, so we keep it off PR
#     critical path. A failure on main fires an alert; PRs catch the
#     same regressions through unit tests for the underlying paths.
#
# Coverage is reported but not yet gated — the audit asked for
# visibility, not a hard threshold. Once a baseline is settled, add a
# `--cov-fail-under=N` flag to the pytest step and a `thresholds`
# block in `vite.config.ts` to enforce regressions.
#
# What's deliberately NOT here:
#   * The `[lemma]` extras (CLTK/Stanza/spaCy + ~300 MB of models).
#     None of the test suite touches them — `tests/` mocks any code
#     path that would call into the lemmatizer. Skip the install to
#     keep cold-cache CI runs reasonable.
#   * `[hegel]` ingest deps (pymupdf, ebooklib, bs4). Same: tests
#     mock the parsers. Installed only when the test suite imports
#     them, via `[dev]` triggers if needed.

name: check

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same branch when a new commit lands;
# saves CI minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python · lint · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the same Python the repo pins so CI matches local
      # behaviour (CLTK/Stanza hold us at <3.14 — see pyproject.toml).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # uv is dramatically faster than pip for a multi-extra install
      # and matches the README + Makefile workflow.
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project (with dev extras)
        run: |
          uv venv -p 3.13
          uv pip install -e '.[dev,hegel,embed]'

      - name: Lint (ruff)
        # --no-sync: run in the env the install step built. Without it,
        # `uv run` re-syncs the full default dependency set, which pulls
        # the LatinCy `la_core_web_sm` model wheel from HuggingFace — a
        # dead URL (404) and unneeded here, since the suite mocks the
        # lemmatizer (the `[lemma]` extra is intentionally not installed).
        run: uv run --no-sync ruff check src tests

      - name: Tests (pytest with coverage)
        # `--cov` reads config from [tool.coverage.run] in
        # pyproject.toml. `xml:coverage.xml` emits the artifact in a
        # format any future Codecov-style action can pick up; the
        # terminal report goes to the action log for at-a-glance review.
        run: uv run --no-sync pytest tests/ -q --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          retention-days: 14

  web:
    name: web · lint · typecheck · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Tests (vitest, unit + component, with coverage)
        # `test:coverage` excludes tests/e2e/** and emits text + lcov
        # + json-summary reports (see vite.config.ts). lcov is the
        # format Codecov / Coveralls consume; json-summary is small
        # enough to read directly from CI logs.
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage/
          retention-days: 14

  web-e2e:
    name: web · e2e (main only)
    runs-on: ubuntu-latest
    # PRs skip this — the unit suite covers the underlying paths and
    # e2e adds ~30s for the server warm-up alone. Main pushes still
    # run it as a regression net.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python project (so `minerva serve` is on PATH)
        # The e2e harness spawns `minerva serve --llm none` from
        # web/tests/e2e — the Python package needs to be installed
        # for that binary to exist.
        working-directory: .
        run: |
          uv venv -p 3.13
          uv pip install -e '.[dev]'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: E2E (vitest tests/e2e)
        # The e2e suite must be able to find `minerva` on PATH.
        # `uv` creates the venv at `.venv/`; activate it so the spawn
        # inherits the right environment.
        run: |
          source ../.venv/bin/activate
          npm run test:e2e
