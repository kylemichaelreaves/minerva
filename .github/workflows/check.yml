# `check` mirrors `make check` (lint + typecheck + tests + author/API
# contract gates) so the gate every contributor runs locally is also
# the gate CI enforces. The suites:
#
#   * python — lint + pytest with coverage
#   * web — lint + typecheck + vitest with coverage
#   * web-e2e — spawns `minerva serve --llm none` against a throwaway
#     index built from `tests/fixtures/corpus.jsonl` and stitches
#     Vitest against it. The fixture is committed, so every assertion
#     runs here exactly as it does locally. It did not use to: the
#     server ran against the gitignored `data/index.sqlite`, and each
#     data-dependent test skipped itself in CI (#133).
#
# On a PR, a `changes` job runs first and skips the suites the diff can't
# break: docs-only runs none, Python-only skips `web`, TypeScript-only skips
# `python`. `sonar` always scans (#723). See the `changes` job below.
#
# Coverage is gated, but not here: SonarCloud's required new-code gate
# (#158) blocks the merge, and `make check`'s `check-diff-coverage` (#255)
# evaluates the same thing locally. This workflow only produces the
# reports Sonar reads. (This paragraph used to say coverage was "not yet
# gated" and suggested `--cov-fail-under`; that stopped being true at #158.)
#
# Every `make check` gate runs here except `check-diff-coverage`, whose
# remote twin (Sonar's coverage gate) is already required. Before #685,
# `check-format-baseline` and
# `check-coverage-exclusions` ran only in `make check`, with no remote
# backstop at all, so a PR from anyone who skipped it could merge with
# either kind of drift.
#
# Installs are locked: `uv sync --locked` resolves from `uv.lock`, not
# fresh from pyproject's ranges, so two runs of the same commit install
# byte-identical dependencies and a stale lock fails the build (#125).
#
# What's deliberately NOT here:
#   * The `[lemma]` extras (spaCy/Stanza + ~300 MB of models). None of
#     the test suite touches them — `tests/` mocks any code path that
#     would call into the lemmatizer. Skip the install to keep
#     cold-cache CI runs reasonable.
#   * The `[embed]` extra (sentence-transformers → torch). On Linux, PyPI's
#     torch wheel depends on the CUDA stack, so installing it downloaded
#     ~2 GB of `nvidia-*` wheels on every `python` run — setup-uv prunes
#     pre-built wheels from its cache, so none of it was ever reused. No
#     test imports it: `minerva.embed` imports sentence-transformers lazily
#     inside the model loader, and the suite stubs the model. Measured
#     before dropping it: 3436 passed, 3 skipped, with and without.
#
# This list used to also claim `[hegel]` was excluded, "installed only
# when the test suite imports them". It never was: the install line has
# carried `hegel` since the initial commit (c30a217), in the same commit
# that wrote the comment saying it didn't. `[hegel]` is installed,
# deliberately — the suite imports the parsers. (`[embed]` was installed
# too, under the same justification, which was never true of it.)
#
# Actions are pinned to commit SHAs, not tags: `@v7` is mutable and a
# compromised action repo can move it. Dependabot's `github-actions`
# ecosystem is configured and bumps the pins, keeping the trailing
# `# v7` comment in step with the SHA (#123).

name: check

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. Without this every job inherits the
# repository default, which for a repo created before the default changed
# is write-all — a token that can push to main, handed to three jobs that
# only read code. The install surface is the reason it matters: `uv sync`
# pulls a few dozen PyPI packages and `npm ci` runs lifecycle scripts
# across the web tree, all with that token in the environment. Jobs needing more declare it themselves (see `sonar`).
permissions:
  contents: read

# Cancel in-flight runs for the same branch when a new commit lands;
# saves CI minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which suites this PR can break, from the paths it changes (#723). The
  # suites gate on its outputs with a job-level `if:`, NOT a workflow-level
  # `paths:` filter: a workflow that never starts leaves its required checks
  # unreported and the PR stuck, while a skipped job reports success.
  # Classification and its fail-safe rules live in scripts/ci_scope.py.
  # Pushes to main always run everything, so Sonar's baseline stays whole and
  # a cross-stack read the classifier doesn't know about fails there.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.scope.outputs.python }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PR checkout is the merge commit, so HEAD^1 is the base tip it
          # merges into, and `HEAD^1 HEAD` is exactly what the PR changes.
          fetch-depth: 2

      - name: Classify changed paths
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only HEAD^1 HEAD | tee /dev/stderr \
              | python3 scripts/ci_scope.py >> "$GITHUB_OUTPUT"
          else
            printf 'python=true\nweb=true\n' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  python:
    name: python · lint · pytest
    runs-on: ubuntu-latest
    needs: changes
    # Fail safe: if `changes` itself fails, run anyway. Plain `needs` would
    # skip this job, and a skipped required check reports success.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Use the same Python the repo pins so CI matches local
      # behaviour (CLTK/Stanza hold us at <3.14 — see pyproject.toml).
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      # uv is dramatically faster than pip for a multi-extra install
      # and matches the README + Makefile workflow.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install project (locked, with dev extras)
        # `uv sync --locked`, not `uv pip install`. `uv pip install` resolves
        # fresh against pyproject's ranges on every run, so a green run and a
        # red run could differ purely in transitive versions with nothing in
        # the diff — and `uv.lock` was installed from by nothing at all (#125).
        #
        # --locked, NOT --frozen. They are easy to confuse and do opposite
        # things here:
        #   --frozen  sync without updating the lock — a stale lock installs
        #             silently, exit 0, ignoring pyproject entirely.
        #   --locked  assert the lock will remain unchanged — a stale lock
        #             fails the build, exit 1.
        # Only --locked keeps lock and pyproject in sync by construction,
        # which is the whole point. Verified both behaviours against a
        # deliberately stale lock before choosing.
        run: uv sync -p 3.13 --locked --extra dev --extra hegel

      - name: Lint (ruff)
        # --no-sync: run in the env the install step built. Without it,
        # `uv run` re-syncs the full default dependency set, which pulls
        # the LatinCy model wheels from HuggingFace — ~44 MB that lint
        # has no use for, since the suite mocks the lemmatizer (the
        # `[lemma]` extra is intentionally not installed).
        #
        # This comment used to say that wheel URL was dead (404). It was:
        # `la_core_web_sm-3.9.4` had been deleted from the HuggingFace
        # repo while pyproject pointed at mutable `resolve/main`. Fixed in
        # #122 — the wheels are now commit-pinned and hash-verified, so
        # --no-sync is a speed choice now, not a workaround.
        #
        # scripts/ and perseus/ are in scope deliberately (#117): they
        # went unlinted for the repo's whole history and accumulated 41
        # F821 undefined names — downloaders that imported fine and blew
        # up with NameError the moment the code path ran (#116).
        run: uv run --no-sync ruff check src tests scripts perseus

      - name: Author manifest sync
        # Mirrors `make check-authors`: generated corpus_registry /
        # author_ordering / atlasData / dominantPhil must match
        # manifest.yaml, and every author must have an ingest entry.
        #
        # Chunk-count bands and chunk granularity are validated here too.
        # `data/index.sqlite` is gitignored and never built in CI, so the
        # check reads the committed `data/authors/chunk_counts.json` and
        # `data/authors/chunk_granularity.json` instead. Before #157 it just
        # found no DB and validated nothing, without saying so — which is
        # how the Plato overrun in #150 stayed green. Local runs have the
        # real index and additionally fail if either snapshot has gone stale.
        #
        # The granularity gate (#176) is baseline-pinned against
        # `granularity.known_coarse` in manifest.yaml, so it fails on newly
        # coarse works without failing on the 753 chunks already over the
        # threshold.
        run: |
          uv run --no-sync python scripts/generate_author_artifacts.py --check
          uv run --no-sync python scripts/check_author_ingest.py --all

      - name: API wire-type contract
        # Mirrors `make check-api-types`: fixture keys must exist on TS
        # wire types so backend/frontend drift is caught before merge.
        run: uv run --no-sync python scripts/check_api_types.py

      - name: Author import hygiene
        # Mirrors `make check-author-imports`: no stale per-author
        # module imports outside the manifest-driven paths.
        run: uv run --no-sync python scripts/check_author_imports.py

      - name: Coverage exclusions agree
        # Mirrors `make check-coverage-exclusions`: pyproject's coverage
        # `omit` and `sonar.coverage.exclusions` must agree on
        # src/minerva/. Sonar can't see a disagreement; it just scores the
        # file 0% (#339, #345). No remote backstop, so it runs here (#685).
        run: uv run --no-sync python scripts/check_coverage_exclusions.py

      - name: Tests (pytest with coverage)
        # `--cov` reads config from [tool.coverage.run] in
        # pyproject.toml. `xml:coverage.xml` emits the artifact in a
        # format any future Codecov-style action can pick up; the
        # terminal report goes to the action log for at-a-glance review.
        #
        # `-n auto` (pytest-xdist): this step ran fully serial despite
        # using only ~55% of one core locally -- it isn't CPU-bound, so
        # splitting across workers is close to free. pytest-cov combines
        # per-worker coverage automatically when pytest-xdist is
        # installed; verified locally that the coverage TOTAL is
        # identical with and without `-n auto` before relying on it.
        #
        # This shrinks the `python` job itself (measured ~1.7x with 2
        # workers, this repo's private-runner core count), but the
        # `python` and `web` jobs run in parallel and were within 5s of
        # each other before this change -- so it does NOT proportionally
        # shrink total CI wall-clock, which stays bounded by whichever
        # job is slower (currently `web`, which already parallelizes
        # vitest across cores by default). Worth having regardless: it
        # makes a red `python` job fail faster, and removes the risk of
        # this job becoming the long pole as the backend suite grows.
        #
        # `--durations=20` lists the slowest tests in the log. Nothing here
        # surfaced them before, and the five live-server fixtures had each
        # been sleeping 0.5s per test in `shutdown()` — ~24s of a serial run.
        #
        # TMPDIR on tmpfs (#757): the suite opens 1,366+ fresh SQLite files,
        # and each `store.open_db` replays the migration chain — 50 commits,
        # each a real fsync in `journal_mode=delete`, `synchronous=FULL`. On
        # this runner's disk a fresh open took 95–377ms median (max 3.3s);
        # on /dev/shm 27–51ms, the same as the disk with sync turned off.
        # Whole step, four parallel runs: 134s/100s on disk, 68s/87s on
        # tmpfs. macOS fsync doesn't flush, which is why none of this shows
        # locally. `mkdir` first: `tempfile` silently falls back to /tmp
        # when TMPDIR doesn't exist, and this would quietly stop working.
        run: |
          mkdir -p /dev/shm/pytest
          TMPDIR=/dev/shm/pytest uv run --no-sync pytest tests/ -q --cov --cov-report=term --cov-report=xml -n auto --durations=20

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-coverage
          path: coverage.xml
          retention-days: 14

  web:
    name: web · lint · typecheck · vitest
    runs-on: ubuntu-latest
    needs: changes
    # Fail safe, as in `python`.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Prettier against the pinned baseline
        # Mirrors `make check-format-baseline` (#483). eslint can't stand in:
        # `eslint-config-prettier` only *disables* formatting rules. Runs
        # prettier over web/ via npx, so it needs the install above; the
        # script is stdlib-only, so the runner's system python3 serves (#685).
        run: python3 ../scripts/check_format_baseline.py

      - name: Frontend test location
        # Mirrors `make check-test-location`. Sonar's coverage gate does
        # catch a test under web/src, but as an unexplained coverage drop
        # (#547); this fails first, and says why. It lives in this job, not
        # `python`, because it guards web/src, and a web-only PR skips
        # `python` (#723). Stdlib-only, so the runner's python3 serves.
        run: python3 ../scripts/check_test_location.py

      - name: Tests (vitest, unit + component, with coverage)
        # `test:coverage` excludes tests/e2e/** and emits text + lcov
        # + json-summary reports (see vite.config.ts). lcov is the
        # format Codecov / Coveralls consume; json-summary is small
        # enough to read directly from CI logs.
        #
        # --maxWorkers=2: vitest's default is availableParallelism() - 1,
        # which on this repo's 2-vCPU private runner is a single worker, so
        # the step used half the machine. Set here, not in vite.config.ts,
        # so local runs keep every core. Locally, one worker → two took the
        # suite from 42.5s to 15.6s (with the vmThreads pool, which only
        # pays off with more than one worker).
        run: npm run test:coverage -- --maxWorkers=2

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-coverage
          path: web/coverage/
          retention-days: 14

  web-e2e:
    name: web · e2e
    runs-on: ubuntu-latest
    # Runs on main pushes, and on PRs that change either stack: it spawns
    # `minerva serve` and drives the built bundle, so either can break it
    # (#723). Fail safe, as in `python`.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true') }}
    # Every assertion executes here — the
    # data-dependent ones (chunk stats, retrieval, works list) included,
    # because the suite builds its own index from the committed fixture
    # rather than relying on an ingested corpus. See
    # web/tests/e2e/serve.test.ts.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python project (so `minerva serve` is on PATH)
        # The e2e harness spawns `minerva serve --llm none` from
        # web/tests/e2e — the Python package needs to be installed
        # for that binary to exist.
        working-directory: .
        # Locked install, same rationale as the python job above (#125).
        run: uv sync -p 3.13 --locked --extra dev

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: E2E (vitest tests/e2e)
        # The e2e suite must be able to find `minerva` on PATH.
        # `uv` creates the venv at `.venv/`; activate it so the spawn
        # inherits the right environment.
        run: |
          source ../.venv/bin/activate
          npm run test:e2e

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the installed @playwright/test version: the browser
          # binary is bound to it, so a bump must miss the cache, and nothing
          # else should. This used to be keyed on the whole package-lock.json
          # hash while this comment claimed the version, so every unrelated
          # npm bump missed, re-downloaded the browser, and saved one more
          # 271 MB entry — a dozen of them held ~3 GB of the repo's 10 GB
          # cache quota at once.
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        # --with-deps installs the system libraries Chromium needs; it is
        # cheap when the browser itself is cached and required when it is not.
        # Deliberately unconditional on the cache step's outcome — this must
        # run even on a cache hit, because --with-deps installs OS packages
        # the cache doesn't cover.
        run: npx playwright install --with-deps chromium

      - name: Browser tests (Playwright)
        run: |
          source ../.venv/bin/activate
          npm run test:browser

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-trace
          path: web/test-results/
          retention-days: 14

  # TWO checks come out of this, and they mean different things:
  #
  #   * `sonarqube`                — THIS job. Green means the scan ran and
  #                                  uploaded. `sonar.qualitygate.wait` is not
  #                                  set, so it exits 0 regardless of the
  #                                  verdict. It is NOT a required context.
  #   * `SonarCloud Code Analysis` — posted by the SonarCloud GitHub App, and
  #                                  carries the quality-gate verdict. This is
  #                                  the required one.
  #
  # So `sonarqube` passing while `SonarCloud Code Analysis` fails is normal,
  # not a contradiction — it means the scan succeeded and the gate said no.
  # Read the second one for pass/fail of the code.
  sonar:
    name: sonarqube
    runs-on: ubuntu-latest
    # Only after both suites pass, so the scan always has real coverage
    # to attach. `needs` also means a red build doesn't spend a scan.
    needs: [python, web]
    # Fork PRs cannot read secrets; the scan would fail on a missing
    # token rather than say anything useful. Skip instead.
    #
    # Dependabot PRs are NOT forks — they come from a branch in this repo,
    # so they pass this condition and the job runs. They still used to fail,
    # for a different reason: a `pull_request` event raised by Dependabot
    # reads from the **Dependabot** secrets store, not the Actions one, so
    # `secrets.SONAR_TOKEN` resolved to empty and the scan died before
    # SonarCloud could post its `SonarCloud Code Analysis` check. That
    # context is required by branch protection, so no Dependabot PR could
    # ever merge — #197, which is why #181 was closed instead of landed.
    #
    # Fixed by adding SONAR_TOKEN to Settings -> Secrets and variables ->
    # Dependabot, alongside the Actions copy. **The token must exist in
    # both stores.** Rotating it in one place only will silently
    # reintroduce #197, and the symptom will be a missing check rather
    # than a failing one — much harder to read.
    #
    # It must run even when a suite above was skipped (#723). The required
    # `SonarCloud Code Analysis` check is posted only after a scan, so a
    # skipped scan strands the PR. `needs` alone would skip it, hence
    # `!cancelled()` and the explicit failure checks. A skipped suite has no
    # coverage to download, and needs none: its stack has no new code, and
    # the gate scores only new code.
    if: >-
      !cancelled()
      && needs.python.result != 'failure'
      && needs.web.result != 'failure'
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Sonar needs full history to attribute new code to a commit
          # and to resolve the PR base. A shallow clone makes every line
          # look new on the first scan of a branch.
          fetch-depth: 0

      # Coverage is produced by the two jobs above rather than
      # regenerated here — re-running the suites would double CI time
      # for identical numbers.
      - name: Download python coverage
        if: needs.python.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-coverage

      - name: Download web coverage
        if: needs.web.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-coverage
          path: web/coverage

      - name: Cache Sonar JRE and analyzers
        # The scanner provisions a JRE and downloads its language analyzers
        # into ~/.sonar/cache on every run — ~8s and ~5s of each scan, on the
        # critical path after `python`. The scanner checks each file's hash
        # and fetches only what it lacks, so a stale entry costs a download,
        # never a wrong analysis. Keyed on this workflow file so a Dependabot
        # bump of the scan action's pin saves a fresh entry.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('.github/workflows/check.yml') }}
          restore-keys: sonar-${{ runner.os }}-

      - name: SonarQube scan
        # Config lives in sonar-project.properties at the repo root.
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
