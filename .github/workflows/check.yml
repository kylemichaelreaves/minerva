# `check` mirrors `make check` (lint + typecheck + tests + author/API
# contract gates) so the gate every contributor runs locally is also
# the gate CI enforces. Three jobs:
#
#   * python — lint + pytest with coverage
#   * web — lint + typecheck + vitest with coverage
#   * web-e2e — spawns `minerva serve --llm none` against a throwaway
#     index built from `tests/fixtures/corpus.jsonl` and stitches
#     Vitest against it. The fixture is committed, so every assertion
#     runs here exactly as it does locally. It did not use to: the
#     server ran against the gitignored `data/index.sqlite`, and each
#     data-dependent test skipped itself in CI (#133).
#
# Coverage is reported but not yet gated — the audit asked for
# visibility, not a hard threshold. Once a baseline is settled, add a
# `--cov-fail-under=N` flag to the pytest step and a `thresholds`
# block in `vite.config.ts` to enforce regressions.
#
# What's deliberately NOT here:
#   * The `[lemma]` extras (CLTK/Stanza/spaCy + ~300 MB of models).
#     None of the test suite touches them — `tests/` mocks any code
#     path that would call into the lemmatizer. Skip the install to
#     keep cold-cache CI runs reasonable.
#   * `[hegel]` ingest deps (pymupdf, ebooklib, bs4). Same: tests
#     mock the parsers. Installed only when the test suite imports
#     them, via `[dev]` triggers if needed.
#
# Actions are pinned to commit SHAs, not tags: `@v7` is mutable and a
# compromised action repo can move it. Dependabot's `github-actions`
# ecosystem is configured and bumps the pins, keeping the trailing
# `# v7` comment in step with the SHA (#123).

name: check

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. Without this every job inherits the
# repository default, which for a repo created before the default changed
# is write-all — a token that can push to main, handed to three jobs that
# only read code. The install surface is the reason it matters: `uv pip
# install -e '.[dev,hegel,embed]'` pulls the torch stack and `npm ci` runs
# lifecycle scripts across the web tree, all with that token in the
# environment. Jobs needing more declare it themselves (see `sonar`).
permissions:
  contents: read

# Cancel in-flight runs for the same branch when a new commit lands;
# saves CI minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python · lint · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Use the same Python the repo pins so CI matches local
      # behaviour (CLTK/Stanza hold us at <3.14 — see pyproject.toml).
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      # uv is dramatically faster than pip for a multi-extra install
      # and matches the README + Makefile workflow.
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install project (with dev extras)
        run: |
          uv venv -p 3.13
          uv pip install -e '.[dev,hegel,embed]'

      - name: Lint (ruff)
        # --no-sync: run in the env the install step built. Without it,
        # `uv run` re-syncs the full default dependency set, which pulls
        # the LatinCy model wheels from HuggingFace — ~44 MB that lint
        # has no use for, since the suite mocks the lemmatizer (the
        # `[lemma]` extra is intentionally not installed).
        #
        # This comment used to say that wheel URL was dead (404). It was:
        # `la_core_web_sm-3.9.4` had been deleted from the HuggingFace
        # repo while pyproject pointed at mutable `resolve/main`. Fixed in
        # #122 — the wheels are now commit-pinned and hash-verified, so
        # --no-sync is a speed choice now, not a workaround.
        #
        # scripts/ and perseus/ are in scope deliberately (#117): they
        # went unlinted for the repo's whole history and accumulated 41
        # F821 undefined names — downloaders that imported fine and blew
        # up with NameError the moment the code path ran (#116).
        run: uv run --no-sync ruff check src tests scripts perseus

      - name: Author manifest sync
        # Mirrors `make check-authors`: generated corpus_registry /
        # author_ordering / atlasData / dominantPhil must match
        # manifest.yaml, and every author must have an ingest entry.
        #
        # Chunk-count bands are validated here too. `data/index.sqlite` is
        # gitignored and never built in CI, so the check reads the committed
        # `data/authors/chunk_counts.json` instead. Before #157 it just found
        # no DB and validated nothing, without saying so — which is how the
        # Plato overrun in #150 stayed green. Local runs have the real index
        # and additionally fail if that snapshot has gone stale.
        run: |
          uv run --no-sync python scripts/generate_author_artifacts.py --check
          uv run --no-sync python scripts/check_author_ingest.py --all

      - name: API wire-type contract
        # Mirrors `make check-api-types`: fixture keys must exist on TS
        # wire types so backend/frontend drift is caught before merge.
        run: uv run --no-sync python scripts/check_api_types.py

      - name: Author import hygiene
        # Mirrors `make check-author-imports`: no stale per-author
        # module imports outside the manifest-driven paths.
        run: uv run --no-sync python scripts/check_author_imports.py

      - name: Tests (pytest with coverage)
        # `--cov` reads config from [tool.coverage.run] in
        # pyproject.toml. `xml:coverage.xml` emits the artifact in a
        # format any future Codecov-style action can pick up; the
        # terminal report goes to the action log for at-a-glance review.
        run: uv run --no-sync pytest tests/ -q --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-coverage
          path: coverage.xml
          retention-days: 14

  web:
    name: web · lint · typecheck · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Tests (vitest, unit + component, with coverage)
        # `test:coverage` excludes tests/e2e/** and emits text + lcov
        # + json-summary reports (see vite.config.ts). lcov is the
        # format Codecov / Coveralls consume; json-summary is small
        # enough to read directly from CI logs.
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-coverage
          path: web/coverage/
          retention-days: 14

  web-e2e:
    name: web · e2e
    runs-on: ubuntu-latest
    # Runs on PRs and main pushes. Every assertion executes here — the
    # data-dependent ones (chunk stats, retrieval, works list) included,
    # because the suite builds its own index from the committed fixture
    # rather than relying on an ingested corpus. See
    # web/tests/e2e/serve.test.ts.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install Python project (so `minerva serve` is on PATH)
        # The e2e harness spawns `minerva serve --llm none` from
        # web/tests/e2e — the Python package needs to be installed
        # for that binary to exist.
        working-directory: .
        run: |
          uv venv -p 3.13
          uv pip install -e '.[dev]'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: E2E (vitest tests/e2e)
        # The e2e suite must be able to find `minerva` on PATH.
        # `uv` creates the venv at `.venv/`; activate it so the spawn
        # inherits the right environment.
        run: |
          source ../.venv/bin/activate
          npm run test:e2e

  sonar:
    name: sonarqube
    runs-on: ubuntu-latest
    # Only after both suites pass, so the scan always has real coverage
    # to attach. `needs` also means a red build doesn't spend a scan.
    needs: [python, web]
    # Fork PRs cannot read secrets; the scan would fail on a missing
    # token rather than say anything useful. Skip instead.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Sonar needs full history to attribute new code to a commit
          # and to resolve the PR base. A shallow clone makes every line
          # look new on the first scan of a branch.
          fetch-depth: 0

      # Coverage is produced by the two jobs above rather than
      # regenerated here — re-running the suites would double CI time
      # for identical numbers.
      - name: Download python coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-coverage

      - name: Download web coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: web-coverage
          path: web/coverage

      - name: SonarQube scan
        # Config lives in sonar-project.properties at the repo root.
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
