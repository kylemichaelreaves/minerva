version: 2
updates:
  # Python (uv / pyproject.toml + uv.lock at repo root).
  #
  # `uv`, not `pip`. Dependabot treats them as separate ecosystems, and only
  # the `uv` one maintains `uv.lock`. That was cosmetic while nothing
  # installed from the lock, but CI now runs `uv sync --locked` (#125), which
  # fails the build when the lock and pyproject disagree — so a bot that
  # edited pyproject alone would open PRs that cannot go green.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Web frontend (npm)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # eslint majors only. eslint 9 patches/minors still flow.
      #
      # `eslint-plugin-solid` caps its peer range at eslint ^9, so any v10
      # bump fails `npm ci` in ~10s with ERESOLVE, before a single lint rule
      # runs. 0.14.5 is its latest release and no published version has ever
      # allowed eslint 10 — there is no plugin bump that unblocks it (#222,
      # PR #219).
      #
      # Without this, Dependabot re-opens an unmergeable PR every week. The
      # cost isn't the CI minutes; it's that a permanently-red Dependabot PR
      # trains everyone to read red as normal, which is how a real failure
      # gets waved through.
      #
      # REMOVE THIS when `eslint-plugin-solid` ships eslint 10 support:
      #   curl -sS https://registry.npmjs.org/eslint-plugin-solid \
      #     | jq -r '.versions[.["dist-tags"].latest].peerDependencies.eslint'
      # If that prints a range including ^10, delete this ignore block.
      #
      # Dropping the plugin instead is the wrong trade — it is the source of
      # the `solid/reactivity` rule, and reactivity bugs are a live category
      # here (#141 is one).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      # vitest and its coverage provider move as one, including majors.
      #
      # `@vitest/coverage-v8` declares an EXACT peer on vitest
      # (`peer vitest@"4.1.11"`, not a range), so a PR bumping either one
      # alone fails `npm ci` with ERESOLVE before a test runs. Dependabot
      # opened exactly that pair on 2026-09-12 — #567 raised coverage-v8 and
      # #569 raised vitest, and each failed on the half the other was
      # holding. Neither could ever have gone green.
      #
      # Listed BEFORE `npm-minor-patch` because the first matching group
      # wins: these two belong together at every update type, not only at
      # majors.
      #
      # This is the same class of problem as the eslint block above — a
      # constraint between packages that the bot cannot see — and the same
      # argument applies: a permanently-red Dependabot PR teaches everyone
      # to read red as normal.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
