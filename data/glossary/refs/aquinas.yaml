version: 1

# Aquinas's canonical references to Aristotle (and other authors).
# Loaded by `poietes refs load-spec`. Insert is idempotent via
# content-key (source_chunk_id, target_id, type, source_form, quoted_phrase),
# so re-running this file does not duplicate rows.
#
# Each entry uses the `chunk_id` form of `source` because the
# Aquinas chunks are content-hashed; the readable (author, work,
# section) triples are noted as comments above each block. Run
#
#     poietes refs list --source-author Aquinas
#
# after loading to verify the rows landed at the expected source
# anchors.

references:

  # ST I, q. 2, a. 3 (the Five Ways) → Aristotle Physics VIII
  - source: { chunk_id: "c856b7a9d38b3700eab0" }
    target:
      author: Aristotle
      work: Physics
      locator: "VIII.6"
    type: cites
    source_form: "Aristoteles in VIII Physicorum"
    note: |
      The Second Way's prime-mover proof appeals directly to Phys.
      VIII.6 (the kineton akineton). The famous "manus baculum movet"
      example in the corpus is Aristotle's own.

  # ST I, q. 75, a. 1 (whether the soul is a body) → Aristotle De anima II
  - source: { chunk_id: "a6d37424784994d076b3" }
    target:
      author: Aristotle
      work: On the Soul
      locator: "II.1"
    type: cites
    source_form: "Philosophus"
    note: |
      Aquinas's hylomorphic anthropology takes Phil. De an. II.1's
      definition of soul as actus primus corporis physici as its
      starting point.

  # ST I, q. 84, a. 7 (whether the intellect understands without
  # phantasm) → Aristotle De anima III.7
  - source: { chunk_id: "4f1c245883e7aad638ed" }
    target:
      author: Aristotle
      work: On the Soul
      locator: "III.7"
    type: cites
    source_form: "Philosophus"
    quoted_phrase: "phantasmata"
    note: |
      The locus classicus on Aquinas's appropriation of Aristotelian
      cognition (cf. De an. III.7, 431a16). "Necesse est intelligentem
      phantasmata speculari."

  # ST I-II, q. 1, a. 1 (whether human acts are for an end) →
  # Aristotle NE I.1
  - source: { chunk_id: "0238305a037be0077af2" }
    target:
      author: Aristotle
      work: Nicomachean Ethics
      locator: "I.1"
    type: cites
    source_form: "Philosophus"
    note: |
      Opens the Secunda Pars's ethics-as-teleology by quoting NE I.1's
      "omne agens agit propter finem" — every art and inquiry aims at
      some good.

  # ST I-II, q. 2, a. 1 (whether beatitude consists in wealth) →
  # Aristotle NE I.4-5
  - source: { chunk_id: "52fbe41af1a5ac233a1e" }
    target:
      author: Aristotle
      work: Nicomachean Ethics
      locator: "I.4"
    type: cites
    source_form: "Philosophus"
    note: |
      Reuses NE I.4's argument that wealth is instrumental, not the
      final good. Aquinas's frame: divitiae as means to felicitas.

  # ST I-II, q. 90, a. 1 (whether law is something pertaining to
  # reason) → Aristotle NE V.1
  - source: { chunk_id: "3fc421696f34caad1b00" }
    target:
      author: Aristotle
      work: Nicomachean Ethics
      locator: "V.1"
    type: cites
    source_form: "Philosophus"
    note: |
      The Treatise on Law opens against NE V.1's account of legal
      justice ("nomos = orthos logos"). Aquinas's definition of lex
      sits squarely in this lineage.

  # ST II-II, q. 23, a. 1 (whether caritas is friendship) →
  # Aristotle NE VIII.2
  - source: { chunk_id: "aca0d90cccfc87e82bea" }
    target:
      author: Aristotle
      work: Nicomachean Ethics
      locator: "VIII.2"
    type: cites
    source_form: "Philosophus"
    note: |
      The argument that caritas is a kind of amicitia maps onto NE
      VIII's philia. Aquinas's threefold structure (benevolentia +
      mutua + based on shared good) is the Aristotelian skeleton
      filled with theological content.

  # SCG I, cap. 13 (the proof of God from motion) → Aristotle
  # Physics VIII (whole-book reference)
  - source: { chunk_id: "716a9f8f940fb4f5620b" }
    target:
      author: Aristotle
      work: Physics
      locator: "VIII"
    type: cites
    source_form: "Aristoteles"
    note: |
      SCG's first proof of God's existence is a sustained
      paraphrastic argument from Phys. VIII as a whole, more detailed
      than the ST's Five Ways and explicitly attributed.

  # SCG III, cap. 25 (that to know God is the end of every
  # intellectual creature) → Aristotle Metaphysics XII
  - source: { chunk_id: "e69c9b3cc04bdf02c7e8" }
    target:
      author: Aristotle
      work: Metaphysics
      locator: "XII"
    type: paraphrases
    source_form: "Philosophus"
    note: |
      Reworks Met. XII (Lambda)'s argument that the prime mover is
      thought-thinking-itself into a Christianized teleology where
      the human telos is the visio Dei.
