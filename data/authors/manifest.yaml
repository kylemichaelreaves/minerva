# Chunk-granularity gate (#176). Thresholds plus the hand-reviewed baseline
# of work/lang pairs that already exceed them.
#
# `known_coarse` is the pin that makes the gate landable: a bare "no chunk
# over max_chunk_chars" assertion fails on all 753 existing oversized chunks
# and cannot be merged, which is the trap #229 is stuck in. Listed pairs are
# allowed their measured coarseness (plus `tolerance_pct` headroom, so an
# ordinary text edit that nudges a mean by a character does not fail CI);
# anything NOT listed fails, which is the new-violation case the gate is for.
#
# Two kinds of entry are mixed here on purpose, because the gate cannot tell
# them apart and a human must:
#
#   * Parser failures — the parser found no structural divisions and emitted
#     the whole document. Aeschylus's Agamemnon (eng) as a single 82,256-char
#     chunk, Hobbes's De Cive and Leviathan (lat), Epictetus's Discourses
#     (eng, whose four largest chunks hold 97% of the text). These are bugs;
#     #176 part 2 re-chunks them and their entries then come OUT of this list.
#   * Real structural levels that are simply coarse — the Aquinas
#     commentaries, whose articulus-level divisions are genuine. Changing
#     those is a chunking-design decision, not a bug fix, and out of scope.
#
# Measurements live in data/authors/chunk_granularity.json, regenerated by
# `make generate-authors`. Do not hand-edit that file; do hand-edit this one.
# Removing an entry that has been fixed is enforced: a stale `known_coarse`
# key fails `make check-authors` the same way a new violation does, so the
# baseline shrinks instead of accumulating.
granularity:
  max_chunk_chars: 8000
  max_mean_chunk_chars: 3000
  # The floor (#404). Every other threshold here bounds coarseness, so a
  # work could fragment without limit and pass — Babrius eng sat at a
  # 44-character median across 2,139 chunks and never appeared. Verse-
  # addressed works are exempt on `works.citation_system`, the same
  # signal retrieve.py uses for its own floor; without that exemption
  # this lists 110 pairs, most of them Quran suras that are correct.
  min_mean_chunk_chars: 100
  tolerance_pct: 5
  # Pairs below `min_mean_chunk_chars`. #420's two entries (the zeno.org
  # title-page defect) are gone: both works were re-fetched and
  # re-ingested once the encoding bug in download_kant_de.py was fixed,
  # and the gate's stale-entry check forced their removal here.
  known_fine: {}
  known_coarse:
